[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @miciodev/shared-types build && pnpm --filter @miciodev/event-relay build"

[deploy]
startCommand = "HOST=0.0.0.0 node packages/event-relay/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
